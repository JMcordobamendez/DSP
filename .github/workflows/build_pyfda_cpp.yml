# Build the C++ / Qt port of pyfda (pyfda_cpp/), compare its numerical core with
# scipy and create a Windows executable (artifact "pyfda_cpp_win").
name: build_pyfda_cpp

on:
  push:
    paths:
      - 'pyfda_cpp/**'
      - '.github/workflows/build_pyfda_cpp.yml'
  pull_request:
    paths:
      - 'pyfda_cpp/**'
      - '.github/workflows/build_pyfda_cpp.yml'
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: pip install numpy scipy

      - name: Build numerical core and CLI
        run: |
          cmake -S pyfda_cpp -B build -DPYFDA_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Compare with scipy
        run: python pyfda_cpp/tests/verify_scipy.py build/pyfda_cli

      - name: Check the translations (all strings translated, placeholders match)
        run: python pyfda_cpp/tools/update_ts.py --check

      - name: Simulate the generated VHDL and Verilog (GHDL, Icarus Verilog)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghdl iverilog
          python pyfda_cpp/tests/verify_vhdl.py build/pyfda_cli

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: pip install numpy scipy

      - name: Build
        run: |
          cmake -S pyfda_cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Compare with scipy (MSVC build)
        run: python pyfda_cpp/tests/verify_scipy.py build/pyfda_cli.exe

      - name: Deploy Qt libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pyfda_cpp | Out-Null
          Copy-Item build/pyfda_cpp.exe dist/pyfda_cpp/
          Copy-Item pyfda_cpp/examples/measurement.csv dist/pyfda_cpp/
          Copy-Item pyfda_cpp/examples/lowpass_50Hz.json dist/pyfda_cpp/
          windeployqt --release --translations es --no-system-d3d-compiler --no-opengl-sw dist/pyfda_cpp/pyfda_cpp.exe

      - name: Smoke test of the executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}/plugins
        run: |
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--data', 'pyfda_cpp/examples/measurement.csv', '--filter', '--export', 'smoke.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "pyfda_cpp.exe failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path smoke.csv)) { throw "smoke.csv was not written" }
          Get-Content smoke.csv -TotalCount 3
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--save-filter', 'smoke.json', '--stim', 'sine', '--tran-export', 'tran.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "pyfda_cpp.exe failed with exit code $($p.ExitCode)" }
          # coefficients may differ in the last digit between compilers, compare the specs only
          $saved = Get-Content smoke.json -Raw | ConvertFrom-Json
          $orig = Get-Content pyfda_cpp/examples/lowpass_50Hz.json -Raw | ConvertFrom-Json
          if (($saved.spec | ConvertTo-Json) -ne ($orig.spec | ConvertTo-Json)) { throw "saved filter specs differ from the loaded ones" }
          Get-Content tran.csv -TotalCount 3
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--fixpoint', '--tran-export', 'tran_fx.csv', '--export-hdl', 'lowpass.vhd' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "pyfda_cpp.exe failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path lowpass.vhd -Pattern 'entity lowpass is' -Quiet)) { throw "VHDL was not written" }
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--manual-zpk', '0.5:0.5,0.5:-0.5/0.9/2', '--save-filter', 'manual.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "manual P/Z design failed with exit code $($p.ExitCode)" }
          $m = Get-Content manual.json -Raw | ConvertFrom-Json
          if ($m.spec.method -ne 'manual_iir' -or $m.zpk.k -ne 2) { throw "manual P/Z filter not saved correctly" }
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/ma_lowpass.json', '--save-filter', 'ma.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "moving average design failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--export-hdl', 'lowpass.v', '--hdl-testbench' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Verilog export failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path lowpass_tb.v -Pattern 'module lowpass_tb' -Quiet)) { throw "Verilog testbench was not written" }
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--formula', 'A1*sin(2*pi*(5+200*t)*t)', '--tran-export', 'tran_formula.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "formula stimulus failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--stim-file', 'tran.csv', '--tran-export', 'tran_file.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "file stimulus failed with exit code $($p.ExitCode)" }
          # configuration: the session is saved on close and restored on the next start, CSV format from the INI file
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--config-dir', 'cfg', '--load-filter', 'pyfda_cpp/examples/ma_lowpass.json', '--quit' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "saving the session failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path cfg/pyfda/pyfda_cpp_session.json)) { throw "the session was not saved" }
          Add-Content cfg/pyfda/pyfda_cpp.ini "`n[csv]`ndelimiter=semicolon`ndecimal_comma=true"
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--config-dir', 'cfg', '--save-filter', 'session.json', '--stim', 'sine', '--tran-export', 'tran_es.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "restoring the session failed with exit code $($p.ExitCode)" }
          $saved = Get-Content session.json -Raw | ConvertFrom-Json
          $orig = Get-Content ma.json -Raw | ConvertFrom-Json
          if (($saved.spec | ConvertTo-Json) -ne ($orig.spec | ConvertTo-Json)) { throw "the restored session differs from the saved one" }
          $l = Get-Content tran_es.csv -TotalCount 3
          if ($l[0] -ne 'n;t;x;y' -or $l[2] -notmatch '^1;0,') { throw "CSV format from the configuration not used: $l" }
          # complex stimulus: real and imaginary parts are exported in separate columns
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--formula', 'exp(2j*pi*f1*n)', '--tran-export', 'tran_cplx.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "complex stimulus failed with exit code $($p.ExitCode)" }
          $l = Get-Content tran_cplx.csv -TotalCount 1
          if ($l -ne 'n,t,x_re,x_im,y_re,y_im') { throw "complex transient export has the header '$l'" }
          # dragging a pole in the P/Z tab turns the design into a manual filter, the conjugate pole follows
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--config-dir', 'cfg_pz', '--drag-pz', '7:0.8:0.3', '--save-filter', 'drag.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "P/Z drag failed with exit code $($p.ExitCode)" }
          $d = Get-Content drag.json -Raw | ConvertFrom-Json
          $moved = @($d.zpk.p | Where-Object { [math]::Abs($_[0] - 0.8) -lt 1e-9 -and [math]::Abs([math]::Abs($_[1]) - 0.3) -lt 1e-9 })
          if ($d.spec.method -ne 'manual_iir' -or $moved.Count -ne 2) { throw "dragged pole pair not found in drag.json" }
          # Spanish user interface
          $p = Start-Process -FilePath dist/pyfda_cpp/pyfda_cpp.exe -ArgumentList '--config-dir', 'cfg_es', '--lang', 'es', '--load-filter', 'pyfda_cpp/examples/lowpass_50Hz.json', '--stim', 'sine', '--tran-export', 'tran_lang.csv' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--lang es failed with exit code $($p.ExitCode)" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pyfda_cpp_win
          path: dist/pyfda_cpp
          if-no-files-found: error
